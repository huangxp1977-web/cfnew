name: Auto Sync & Generate Pages Worker

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨自动检查一次上游更新
  workflow_dispatch:     # 支持手动随时一键触发
  push:
    branches:
      - main
    paths:
      - '明文源吗'

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate _worker.js for Cloudflare Pages
        run: |
          if [ -f "明文源吗" ]; then
            cp "明文源吗" "_worker.js"
            echo "Successfully copied '明文源吗' to '_worker.js'"
          else
            echo "Error: '明文源吗' not found"
            exit 1
          fi

      - name: Commit and push _worker.js
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          if git diff --staged --quiet; then
            echo "No changes in _worker.js, skipping commit."
          else
            git commit -m "chore(pages): auto generate _worker.js from upstream source"
            git push origin main
          fi
